<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Base Insight Engine 🔵</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at top, #0d1117, #020617);
  color: white;
  text-align: center;
  margin: 0;
  padding: 20px;
}

h1 {
  font-size: 28px;
  margin-bottom: 5px;
}

.subtitle {
  color: #8b949e;
  margin-bottom: 25px;
}

.container {
  max-width: 600px;
  margin: auto;
}

input {
  padding: 14px;
  width: 65%;
  border-radius: 8px;
  border: none;
  background: #161b22;
  color: white;
}

button {
  padding: 14px;
  border-radius: 8px;
  border: none;
  background: linear-gradient(90deg, #238636, #2ea043);
  color: white;
  cursor: pointer;
  margin-left: 8px;
}

button:hover {
  opacity: 0.9;
}

.card {
  background: #161b22;
  border-radius: 12px;
  padding: 15px;
  margin-top: 20px;
  box-shadow: 0 0 15px rgba(0, 255, 150, 0.1);
  text-align: left;
}

.tx {
  border-bottom: 1px solid #30363d;
  padding: 10px 0;
}

.tx:last-child {
  border-bottom: none;
}

.glow {
  color: #00ffcc;
}
</style>
</head>

<body>

<div class="container">
  <h1 class="glow">Base Insight Engine 🔵</h1>
  <p class="subtitle">Turning onchain activity into readable insights</p>

  <input id="wallet" placeholder="Enter wallet address">
  <button onclick="loadData()">Analyze</button>

  <div id="summary" class="card"></div>
  <div id="insight" class="card"></div>
  <div id="result" class="card"></div>
</div>

<script src="script.js"></script>

</body>
</html>
